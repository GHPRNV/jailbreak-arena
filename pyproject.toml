[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-jailbreak-arena"
version = "0.1.0"
description = "JailbreakArena: adversarial self-play environment for AI safety, built on OpenEnv."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "JailbreakArena Team" },
]
keywords = ["rl", "self-play", "safety", "alignment", "red-team", "openenv", "grpo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openenv-core[core]>=0.2.2",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.24.0",
    "requests>=2.31.0",
    "fastmcp>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
train = [
    "trl[vllm]>=0.12.0",
    "transformers>=4.45.0",
    "datasets>=3.0.0",
    "trackio>=0.1.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "numpy<2.0.0",
]

[project.urls]
Homepage = "https://huggingface.co/spaces/M134pra/jailbreak-arena"
Repository = "https://github.com/GHPRNV/jailbreak-arena"

[project.scripts]
server = "jailbreak_arena.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["jailbreak_arena", "jailbreak_arena.server"]
package-dir = { "jailbreak_arena" = ".", "jailbreak_arena.server" = "server" }

[tool.setuptools.package-data]
"jailbreak_arena" = ["data/*.json", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib --rootdir=tests"
norecursedirs = ["server", "data", "notebooks", "scripts", "plots", "docs", ".venv", "__pycache__"]
python_files = ["test_*.py"]
